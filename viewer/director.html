<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Jérôme Director</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Director">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="dash">
  <header>
    <div>
      <h1 id="headline">Jérôme</h1>
      <div class="muted" id="updated">…</div>
    </div>
    <div>
      <select id="theme" aria-label="theme"><option value="auto">◐</option><option value="light">☀</option><option value="dark">☾</option></select>
    </div>
  </header>
  <div id="error" class="error" hidden></div>
  <section id="todo" hidden></section>
  <section id="projects"></section>
  <section id="quota"></section>
  <details id="details"><summary id="details-title"></summary><div id="details-body"></div></details>
  <footer id="footer"></footer>
</main>
<script>
'use strict';
// The token is in the address's fragment, which the browser never sends: the page passes it in a header.
const token = decodeURIComponent(location.hash.slice(1));
const REFRESH_MS = 30_000;
// A Mac that has not beaten for this long is worth telling: it beats every minute.
const SILENT_MIN = 15;
let data = null;
const filters = { mac: '', project: '' };

// The page's own words, in the user's language (D163); the server writes the blocks' sentences.
const WORDS = {
  en: {
    calm: 'Everything goes on by itself.',
    waiting: (n) => `${n} ${n === 1 ? 'thing waits' : 'things wait'} for you.`,
    updated: (t) => `updated ${t} · every 30 s`,
    todo: 'What you need to do',
    question: 'Question',
    options: 'Options',
    recommended: 'Recommended',
    answerHow: 'Answer on Telegram, or in a session in the project.',
    silent: (mac, since) => `The Mac ${mac} has not been heard from since ${since}. Is it on and connected?`,
    pending: (mac) => `The Mac ${mac} waits for your approval: \`jerome director approve\` on the server.`,
    projects: 'Projects',
    noProjects: 'No project yet: connect a Mac with `jerome connect`.',
    state: { running: 'working now', stuck: 'stopped, needs you', retrying: 'hit a snag, trying again by itself', asking: 'waiting for your answer', paused: 'paused at its limit', idle: 'waiting for its next turn' },
    next: (s) => `turns: ${s}`,
    lastWork: (ago, what) => `last work ${ago}: ${what}`,
    noWork: 'no work done yet',
    quota: 'Quota this week',
    noQuota: 'No reading yet: it comes with the first beat of a Mac.',
    used: (seven, five) => `Week ${seven}%${five !== null ? ` · 5 hours ${five}%` : ''}`,
    pace: (target, reset) => `the pace for today is ${target}% · reset ${reset}`,
    verdict: { behind: 'below the pace: Jérôme uses the spare quota', ahead: 'above the pace: Jérôme slows down', release: 'last day: what is left gets used', burst: 'the 5-hour window resets soon: a short burst', cap: 'the 5-hour window is full: waiting', reserve: 'at your reserve: Jérôme stops to leave it to you', stale: 'no fresh reading' },
    chartPace: 'pace', chartReserve: 'reserve', readings: (n) => `readings this week (${n})`,
    details: 'Details: Macs, runs, past weeks',
    macs: 'Macs', mac: 'Mac', stateCol: 'State', lastBeat: 'Last beat', projectsCol: 'Projects', version: 'Version', code: 'Code',
    connected: 'connected', unreachable: (s) => `silent since ${s}`, approval: 'waiting for approval',
    runs: 'Runs', started: 'Started', project: 'Project', kind: 'Kind', status: 'Status', points: '7d',
    every: { mac: 'every Mac', project: 'every project' },
    weeks: 'Past weeks', noWeeks: 'None yet: the first shows after this week\'s reset.',
    readOnly: 'read-only', never: 'never',
    ago: { now: 'just now', m: (n) => `${n} min ago`, h: (n) => `${n} h ago`, d: (n) => `${n} days ago` },
    noToken: 'This address has no token: open the one `jerome director dashboard` prints on the server.',
    cannot: (e) => `Cannot read the Director: ${e}`,
  },
  it: {
    calm: 'Tutto va avanti da solo.',
    waiting: (n) => `${n} ${n === 1 ? 'cosa aspetta' : 'cose aspettano'} te.`,
    updated: (t) => `aggiornato alle ${t} · ogni 30 s`,
    todo: 'Cosa devi fare tu',
    question: 'Domanda',
    options: 'Opzioni',
    recommended: 'Consiglio',
    answerHow: 'Rispondi da Telegram, o in una sessione nel progetto.',
    silent: (mac, since) => `Il Mac ${mac} non si sente da ${since}. È acceso e in rete?`,
    pending: (mac) => `Il Mac ${mac} aspetta la tua approvazione: \`jerome director approve\` sul server.`,
    projects: 'Progetti',
    noProjects: 'Ancora nessun progetto: collega un Mac con `jerome connect`.',
    state: { running: 'sta lavorando', stuck: 'fermo, serve te', retrying: 'ha trovato un intoppo, riprova da solo', asking: 'aspetta una tua risposta', paused: 'in pausa al suo limite', idle: 'aspetta il prossimo turno' },
    next: (s) => `turni: ${s}`,
    lastWork: (ago, what) => `ultimo lavoro ${ago}: ${what}`,
    noWork: 'nessun lavoro finito ancora',
    quota: 'Quota della settimana',
    noQuota: 'Ancora nessuna lettura: arriva col primo battito di un Mac.',
    used: (seven, five) => `Settimana ${seven}%${five !== null ? ` · 5 ore ${five}%` : ''}`,
    pace: (target, reset) => `il passo di oggi è ${target}% · reset ${reset}`,
    verdict: { behind: 'sotto il passo: Jérôme usa la quota avanzata', ahead: 'sopra il passo: Jérôme rallenta', release: 'ultimo giorno: si usa quello che resta', burst: 'la finestra di 5 ore si azzera a breve: un breve sprint', cap: 'la finestra di 5 ore è piena: attende', reserve: 'alla tua riserva: Jérôme si ferma per lasciarla a te', stale: 'nessuna lettura recente' },
    chartPace: 'passo', chartReserve: 'riserva', readings: (n) => `letture della settimana (${n})`,
    details: 'Dettagli: Mac, run, settimane passate',
    macs: 'Mac', mac: 'Mac', stateCol: 'Stato', lastBeat: 'Ultimo battito', projectsCol: 'Progetti', version: 'Versione', code: 'Codice',
    connected: 'collegato', unreachable: (s) => `muto dal ${s}`, approval: 'aspetta l\'approvazione',
    runs: 'Run', started: 'Inizio', project: 'Progetto', kind: 'Tipo', status: 'Esito', points: '7g',
    every: { mac: 'tutti i Mac', project: 'tutti i progetti' },
    weeks: 'Settimane passate', noWeeks: 'Ancora nessuna: la prima compare dopo il reset di questa settimana.',
    readOnly: 'sola lettura', never: 'mai',
    ago: { now: 'adesso', m: (n) => `${n} min fa`, h: (n) => (n === 1 ? 'un\'ora fa' : `${n} ore fa`), d: (n) => `${n} giorni fa` },
    noToken: 'Questo indirizzo non ha il token: apri quello che stampa `jerome director dashboard` sul server.',
    cannot: (e) => `Non riesco a leggere il Director: ${e}`,
  },
};
const browserLang = (navigator.language || 'en').slice(0, 2);
let W = WORDS[browserLang] ?? WORDS.en;
let LOCALE = navigator.language || 'en-GB';

// Elements are built with textContent only: a reason or a question can hold anything, and none of it is read as HTML.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const SVG = 'http://www.w3.org/2000/svg';
function svg(tag, attrs = {}, text = null) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
  if (text !== null) node.textContent = text;
  return node;
}
const fill = (id, ...children) => document.getElementById(id).replaceChildren(...children.flat(Infinity));
const title = (text, ...meta) => el('h2', {}, el('span', { class: 'cmd' }, text), ...meta);

// Times in this device's own time zone, in the user's language.
const when = (iso) => (iso ? new Date(iso).toLocaleString(LOCALE, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : W.never);
const clock = (iso) => new Date(iso).toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' });
function ago(iso) {
  const ms = Math.max(0, Date.now() - Date.parse(iso));
  if (ms < 60_000) return W.ago.now;
  if (ms < 3_600_000) return W.ago.m(Math.floor(ms / 60_000));
  if (ms < 48 * 3_600_000) return W.ago.h(Math.floor(ms / 3_600_000));
  return W.ago.d(Math.floor(ms / 86_400_000));
}
const STATE_CLASS = { running: 'running', stuck: 'high', retrying: 'warn', asking: 'warn', paused: 'muted', idle: 'muted' };
const VERDICT_CLASS = { go: 'ok', hold: 'warn', reduced: 'muted' };

// Theme: the system's, or the one picked here, remembered in this browser only.
const themeSelect = document.getElementById('theme');
function applyTheme(value) {
  if (value === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', value);
}
try { themeSelect.value = localStorage.getItem('jerome-theme') || 'auto'; } catch { themeSelect.value = 'auto'; }
applyTheme(themeSelect.value);
themeSelect.addEventListener('change', () => {
  applyTheme(themeSelect.value);
  try { localStorage.setItem('jerome-theme', themeSelect.value); } catch { /* not remembered */ }
});

// What the user must do: the server's list, and the Macs that went silent or wait for approval.
function todoItems() {
  const items = data.attention.map((a) => ({ ...a }));
  for (const m of data.machines) {
    if (m.status === 'pending') items.push({ kind: 'mac', text: W.pending(m.name) });
    else if (m.lastBeat && Date.now() - Date.parse(m.lastBeat) > SILENT_MIN * 60_000) items.push({ kind: 'mac', text: W.silent(m.name, when(m.lastBeat)) });
  }
  return items;
}

function renderTodo(items) {
  const section = document.getElementById('todo');
  section.hidden = !items.length;
  if (!items.length) return;
  fill('todo', title(W.todo), items.map((a) => {
    if (a.kind === 'request') {
      return el('div', { class: 'card ask' },
        el('div', { class: 'card-head' }, el('span', { class: 'warn' }, `❓ ${W.question} R${a.id}`), el('span', { class: 'muted' }, ` · ${a.project}`)),
        el('div', { class: 'card-text' }, a.question),
        a.options ? el('div', { class: 'muted' }, `${W.options}: ${a.options}`) : null,
        a.recommendation ? el('div', { class: 'muted' }, `${W.recommended}: ${a.recommendation}`) : null,
        el('div', { class: 'muted small' }, W.answerHow));
    }
    return el('div', { class: 'card stop' },
      a.project ? el('div', { class: 'card-head' }, el('span', { class: 'high' }, '⚠ '), a.project) : null,
      el('div', { class: 'card-text' }, a.text),
      a.since ? el('div', { class: 'muted small' }, a.since) : null);
  }));
}

function renderProjects() {
  if (!data.projects.length) return fill('projects', title(W.projects), el('div', { class: 'muted' }, W.noProjects));
  const order = { stuck: 0, asking: 1, retrying: 2, running: 3, paused: 4, idle: 5 };
  const rows = [...data.projects].sort((a, b) => order[a.state] - order[b.state] || a.name.localeCompare(b.name)).map((p) => {
    const h = p.lastDone;
    const last = h ? W.lastWork(ago(h.at), h.reason) : W.noWork;
    // A snag it is retrying: the sentence for a person, not the runner's reason.
    const snag = p.state === 'retrying' && p.blocks.length ? el('div', { class: 'warn small' }, p.blocks[0].text) : null;
    return el('div', { class: 'row-card' },
      el('div', { class: 'row-head' },
        el('span', { class: 'name' }, p.name),
        el('span', { class: STATE_CLASS[p.state] }, W.state[p.state]),
        data.machines.length > 1 ? el('span', { class: 'muted small' }, p.machine) : null),
      snag,
      el('div', { class: 'muted small clip' }, last),
      p.slots.length ? el('div', { class: 'muted small' }, W.next(p.slots.map((s) => s.at).join(' · '))) : null);
  });
  fill('projects', title(W.projects), rows);
}

function renderQuota() {
  const q = data.quota;
  if (!q) return fill('quota', title(W.quota), el('div', { class: 'muted' }, W.noQuota));
  const live = (x) => (x && (!x.resetsAt || x.resetsAt * 1000 > Date.now()) ? x.used : null);
  const p = q.pace;
  const line = el('div', {}, el('strong', {}, W.used(live(q.windows.seven_day) ?? '—', live(q.windows.five_hour))),
    p.target !== null ? el('span', { class: 'muted' }, ` · ${W.pace(p.target, when(q.resetsAt))}`) : null);
  const verdict = el('div', { class: VERDICT_CLASS[p.verdict] }, W.verdict[p.kind] ?? p.why);
  fill('quota', title(W.quota), line, verdict, chart(q), readingsTable(q));
}

// The week as a line: the 7-day window at each reading against the pace it should keep (dashed) and the ceiling
// the reserve leaves (dotted), from the week's start to its reset.
function chart(q) {
  if (!q.weekStart || !q.series.length) return null;
  const box = el('div', { class: 'chart' });
  const width = Math.max(280, document.getElementById('quota').clientWidth || 600);
  const height = 180;
  const m = { top: 12, right: 64, bottom: 22, left: 34 };
  const t0 = Date.parse(q.weekStart);
  const t1 = Date.parse(q.resetsAt);
  const x = (t) => m.left + ((t - t0) / (t1 - t0)) * (width - m.left - m.right);
  const y = (v) => m.top + (1 - v / 100) * (height - m.top - m.bottom);
  const target = q.settings.target;
  const reserve = q.settings.reserve;
  const paceAt = (t) => target * Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, height, role: 'img', 'aria-label': `${q.series.at(-1).seven}% / ${q.pace.target ?? '—'}%` });
  for (const v of [0, 25, 50, 75, 100]) {
    root.append(svg('line', { class: 'gridline', x1: m.left, x2: width - m.right, y1: y(v), y2: y(v) }));
    root.append(svg('text', { class: 'axis', x: m.left - 6, y: y(v) + 4, 'text-anchor': 'end' }, `${v}%`));
  }
  for (let d = new Date(t0); d.getTime() <= t1; d.setDate(d.getDate() + 1)) {
    const mid = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    if (mid >= t1) break;
    root.append(svg('text', { class: 'axis', x: x(mid), y: height - 6, 'text-anchor': 'middle' }, new Date(mid).toLocaleDateString(LOCALE, { weekday: 'short' })));
  }
  const now = Math.min(Date.now(), t1);
  root.append(svg('line', { class: 'now', x1: x(now), x2: x(now), y1: m.top, y2: height - m.bottom }));
  root.append(svg('line', { class: 'ref', x1: x(t0), y1: y(0), x2: x(t1), y2: y(target) }));
  root.append(svg('text', { class: 'label', x: x(t1) + 6, y: y(target) + 4 }, `${W.chartPace} ${target}%`));
  const release = t1 - 86_400_000;
  root.append(svg('polyline', { class: 'ref reserve', points: `${x(t0)},${y(100 - reserve)} ${x(release)},${y(100 - reserve)} ${x(t1)},${y(100)}` }));
  root.append(svg('text', { class: 'label', x: x(t1) + 6, y: y(100) + 4 }, W.chartReserve));
  const points = q.series.map((s) => [x(Date.parse(s.at)), y(s.seven)]);
  root.append(svg('polyline', { class: 'series', points: points.map((p) => p.join(',')).join(' ') }));
  const last = q.series.at(-1);
  root.append(svg('circle', { class: 'dot', cx: points.at(-1)[0], cy: points.at(-1)[1], r: 4 }));
  root.append(svg('text', { class: 'label value', x: points.at(-1)[0] + 8, y: points.at(-1)[1] - 6 }, `${last.seven}%`));

  // The crosshair: the reading nearest the pointer, with its time, its value and the pace then.
  const cross = svg('line', { class: 'cross', y1: m.top, y2: height - m.bottom, visibility: 'hidden' });
  const dot = svg('circle', { class: 'dot', r: 5, visibility: 'hidden' });
  const tip = el('div', { class: 'tip', hidden: true });
  const hit = svg('rect', { class: 'hit', x: m.left, y: m.top, width: width - m.left - m.right, height: height - m.top - m.bottom });
  root.append(cross, dot, hit);
  const show = (ev) => {
    const r = root.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * width;
    let best = 0;
    for (let i = 1; i < points.length; i += 1) if (Math.abs(points[i][0] - px) < Math.abs(points[best][0] - px)) best = i;
    const s = q.series[best];
    const [cx, cy] = points[best];
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
    tip.textContent = `${when(s.at)} · ${s.seven}% · ${W.chartPace} ${Math.round(paceAt(Date.parse(s.at)) * 10) / 10}%`;
    tip.hidden = false;
    const left = (cx / width) * r.width;
    tip.style.left = `${Math.max(0, Math.min(left + 10, r.width - tip.offsetWidth))}px`;
  };
  const hide = () => {
    cross.setAttribute('visibility', 'hidden');
    dot.setAttribute('visibility', 'hidden');
    tip.hidden = true;
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', hide);
  box.append(root, tip);
  return box;
}

// The chart's readings as a table, for whoever reads it without the line.
function readingsTable(q) {
  if (!q.series.length) return null;
  const rows = [...q.series].reverse().map((s) => el('tr', {}, el('td', {}, when(s.at)), el('td', { class: 'num' }, `${s.seven}%`), el('td', { class: 'num' }, s.five === null ? '—' : `${s.five}%`)));
  return el('details', {}, el('summary', {}, W.readings(q.series.length)),
    el('div', { class: 'scroll' }, el('table', {}, el('tbody', {}, rows))));
}

// Everything else, closed until opened: the Macs, the runs, the past weeks.
function renderDetails() {
  document.getElementById('details-title').textContent = W.details;
  const macs = el('div', { class: 'scroll' }, el('table', {},
    el('thead', {}, el('tr', {}, [W.mac, W.stateCol, W.lastBeat, W.projectsCol, W.version, W.code].map((h, i) => el('th', { class: i === 3 ? 'num' : null }, h)))),
    el('tbody', {}, data.machines.map((m) => el('tr', {},
      el('td', {}, m.name),
      el('td', { class: m.status === 'pending' ? 'warn' : m.reachable ? 'ok' : 'high' }, m.status === 'pending' ? W.approval : m.reachable ? W.connected : W.unreachable(when(m.lastBeat))),
      el('td', {}, m.lastBeat ? ago(m.lastBeat) : W.never),
      el('td', { class: 'num' }, String(m.projects)),
      el('td', { class: 'muted' }, m.version ?? ''),
      el('td', { class: 'muted' }, m.code))))));

  const nameOf = (r) => data.projects.find((p) => p.key === r.project)?.name ?? r.project;
  const macList = [...new Set(data.runs.map((r) => r.machine).filter(Boolean))].sort();
  const projectList = [...new Set(data.runs.map(nameOf))].sort();
  const runsBox = el('div', {});
  const select = (key, values) => {
    const s = el('select', { 'aria-label': W.every[key] }, el('option', { value: '' }, W.every[key]), values.map((v) => el('option', { value: v }, v)));
    s.value = values.includes(filters[key]) ? filters[key] : '';
    s.addEventListener('change', () => { filters[key] = s.value; drawRuns(); });
    return s;
  };
  const drawRuns = () => {
    const shown = data.runs.filter((r) => (!filters.mac || r.machine === filters.mac) && (!filters.project || nameOf(r) === filters.project));
    runsBox.replaceChildren(el('div', { class: 'scroll' }, el('table', {},
      el('thead', {}, el('tr', {}, [W.started, W.project, W.kind, W.status, W.points].map((h, i) => el('th', { class: i === 4 ? 'num' : null }, h)))),
      el('tbody', {}, shown.slice(0, 100).flatMap((r) => {
        const d = r.quota ? r.quota.after?.seven_day - r.quota.before?.seven_day : null;
        return [el('tr', {},
          el('td', {}, when(r.startedAt)),
          el('td', {}, nameOf(r)),
          el('td', {}, r.kind),
          el('td', { class: r.status }, r.status),
          el('td', { class: 'num' }, Number.isFinite(d) ? `${d >= 0 ? '+' : ''}${d}` : '—')),
        el('tr', { class: 'sub' }, el('td', { class: 'wrap muted', colspan: 5 }, r.reason))];
      })))));
  };
  drawRuns();
  const weeks = data.weeks.length
    ? data.weeks.map((w) => el('div', {}, `${when(w.resetAt)}  `, el('span', { class: w.used >= (data.quota?.settings.target ?? 90) ? 'ok' : 'warn' }, `${w.used}%`)))
    : el('div', { class: 'muted' }, W.noWeeks);
  fill('details-body',
    el('h3', {}, W.macs), macs,
    el('h3', {}, W.runs), el('div', { class: 'filters' }, select('mac', macList), select('project', projectList)), runsBox,
    el('h3', {}, W.weeks), weeks);
}

function render() {
  W = WORDS[data.language] ?? W;
  LOCALE = data.language === 'it' ? 'it-IT' : LOCALE;
  document.documentElement.lang = data.language;
  const items = todoItems();
  const headline = document.getElementById('headline');
  headline.textContent = items.length ? W.waiting(items.length) : W.calm;
  headline.className = items.length ? 'warn' : 'ok';
  document.getElementById('updated').textContent = `Jérôme · ${W.updated(clock(data.at))}`;
  renderTodo(items);
  renderProjects();
  renderQuota();
  // The details keep their state, open or closed, across refreshes.
  renderDetails();
  fill('footer', `Jérôme Director ${data.version} · ${W.readOnly}`);
}

async function load() {
  const error = document.getElementById('error');
  if (!token) {
    error.hidden = false;
    error.textContent = W.noToken;
    return;
  }
  try {
    const r = await fetch('/api/overview', { headers: { authorization: `Bearer ${token}` }, cache: 'no-store' });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error ?? `HTTP ${r.status}`);
    data = body;
    error.hidden = true;
    render();
  } catch (err) {
    error.hidden = false;
    error.textContent = W.cannot(err.message);
  }
}

load();
setInterval(load, REFRESH_MS);
