<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Jérôme viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1><span class="muted">jerome view ·</span> <span id="project">Jérôme</span></h1>
      <div class="muted" id="updated">loading…</div>
      <div id="back" hidden><a id="back-link">← $ jerome projects</a></div>
    </div>
    <div>
      <label class="muted" for="theme">theme</label>
      <select id="theme"><option value="auto">auto</option><option value="light">light</option><option value="dark">dark</option></select>
    </div>
  </header>
  <div id="error" class="error" hidden></div>
  <div id="live" hidden></div>
  <div id="overview">
  <section id="windows"></section>
  <section id="cards"></section>
  <section id="areas" hidden></section>
  <section id="requests"></section>
  <section id="team"></section>
  <section id="runs"></section>
  <section id="usage"></section>
  <section id="replies"></section>
  </div>
  <footer id="footer"></footer>
</main>
<script>
'use strict';
const token = new URLSearchParams(location.search).get('t') || '';
// Relative to the page: at `/` for `jerome view`, under `/p/<key>/` for a project opened from `jerome projects --view`.
const api = (path) => `.${path}?t=${encodeURIComponent(token)}`;
const REPLY_LIMIT = 150;
const BAR = 24;
const state = { data: null, open: new Set(), details: new Map(), period: 'week', kind: 'all', area: 'all' };

// Elements are built with textContent only: transcripts can hold anything, and none of it is ever read as HTML.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const fill = (id, ...children) => document.getElementById(id).replaceChildren(...children.flat().filter((c) => c !== null && c !== undefined));
// A section's title, written as the command that prints the same data in a terminal.
const prompt = (command, ...meta) => el('h2', {}, el('span', { class: 'ps' }, '$'), el('span', { class: 'cmd' }, command), ...meta);
const meta = (...children) => el('span', { class: 'meta' }, ...children);

function n(v) {
  if (v >= 1e6) return `${(v / 1e6).toFixed(1).replace(/\.0$/, '')}M`;
  if (v >= 1e3) return `${Math.round(v / 1e3)}k`;
  return String(v ?? 0);
}
// "≈$3.40 API", "<$0.01 API" above zero but below a cent, "$0.00 API" for nothing.
function usd(t) {
  const v = t.apiUsd ?? 0;
  const amount = v > 0 && v < 0.005 ? '<$0.01' : v === 0 ? '$0.00' : `≈$${v.toFixed(2)}`;
  return `${amount}${t.unpriced ? '+?' : ''} API`;
}
const dollars = (v) => `$${Number.isInteger(v) ? v : v.toFixed(2)}`;
const words = (count) => `${count} ${count === 1 ? 'word' : 'words'}`;
const pad = (x) => String(x).padStart(2, '0');
function when(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const today = new Date().toDateString() === d.toDateString();
  return `${today ? '' : `${pad(d.getDate())}/${pad(d.getMonth() + 1)} `}${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function duration(ms) {
  if (ms === null || ms === undefined) return '—';
  const s = Math.round(ms / 1000);
  return s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` : `${Math.floor(s / 60)}:${pad(s % 60)}`;
}

// Theme: the system's, or the one picked here, remembered in this browser only.
const themeSelect = document.getElementById('theme');
function applyTheme(value) {
  if (value === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', value);
}
try { themeSelect.value = localStorage.getItem('jerome-theme') || 'auto'; } catch { themeSelect.value = 'auto'; }
applyTheme(themeSelect.value);
themeSelect.addEventListener('change', () => {
  applyTheme(themeSelect.value);
  try { localStorage.setItem('jerome-theme', themeSelect.value); } catch { /* not remembered */ }
});

// A window's level against its threshold: ok below 75%, warn up to 90%, high from 90%, over beyond 100%.
function level(used, limit) {
  if (typeof limit !== 'number') return '';
  const r = used / limit;
  return r >= 1 ? 'over' : r >= 0.9 ? 'high' : r >= 0.75 ? 'warn' : 'ok';
}

// A bar of block characters, BAR cells wide: the value in eighths of a cell, coloured by its level, the rest as a
// shaded track, and the limit, if any, as a vertical line in its cell.
const EIGHTHS = ['', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
function bar(value, scale, limit, lvl) {
  const eighths = Math.max(0, Math.min(BAR * 8, Math.round((value / scale) * BAR * 8)));
  const full = Math.floor(eighths / 8);
  const cells = [...'█'.repeat(full), ...(eighths % 8 ? [EIGHTHS[eighths % 8]] : [])];
  const at = typeof limit === 'number' ? Math.min(BAR - 1, Math.round((limit / scale) * BAR)) : -1;
  const spans = [];
  let run = '';
  let kind = null;
  const flush = () => { if (run) spans.push(el('span', { class: kind }, run)); run = ''; };
  for (let i = 0; i < BAR; i++) {
    const [c, k] = i === at ? ['│', 'mark'] : i < cells.length ? [cells[i], lvl || 'cyan'] : ['░', 'track'];
    if (k !== kind) { flush(); kind = k; }
    run += c;
  }
  flush();
  return el('span', { class: 'bar', title: typeof limit === 'number' ? `limit at the line` : null }, spans);
}

function renderHeader(d) {
  document.title = `${d.project} · Jérôme`;
  fill('project', d.project);
  fill('updated', `data as of ${when(d.at)} · checked every 10 s while this tab is visible`);
  const names = { five_hour: '5h', seven_day: '7d' };
  const rows = [];
  const latest = Object.values(d.windows).filter((w) => !w.stale).sort((a, b) => b.readAt.localeCompare(a.readAt))[0];
  for (const [name, w] of Object.entries(d.windows)) {
    const limit = d.limits?.[name];
    // A window that has reset since its reading: the old figure says nothing about now.
    if (w.stale) {
      rows.push(el('div', { class: 'row', title: `last reading ${when(w.readAt)} (${w.source})` }, el('span', {}, names[name]), el('span', { class: 'muted' }, '·'.repeat(BAR)),
        el('span', { class: 'muted' }, `no reading since its reset at ${when(new Date(w.resetsAt * 1000).toISOString())}`, typeof limit === 'number' ? ` · limit ${limit}%` : '')));
      continue;
    }
    const lvl = level(w.used, limit);
    rows.push(el('div', { class: 'row', title: limit ? `global limit ${limit}%` : 'no global limit set' },
      el('span', {}, `${names[name]}`), bar(w.used, 100, limit, lvl),
      el('span', {}, el('span', { class: lvl }, `${w.used}%`), typeof limit === 'number' ? ` / ${limit}%` : el('span', { class: 'muted' }, ' no limit'))));
  }
  if (!rows.length) rows.push(el('div', { class: 'muted' }, 'subscription: no reading yet'));
  // The project's limits, in API-equivalent dollars per calendar day and week, with the same colours (D86).
  for (const [name, label] of [['daily', 'today'], ['weekly', 'week']]) {
    const p = d.projectLimits?.[name];
    if (!p) continue;
    const amount = usd({ apiUsd: p.usd }).replace(/ API$/, '');
    const scale = p.limit ? Math.max(p.limit * 1.25, p.usd) : 1;
    rows.push(el('div', { class: 'row', title: `${n(p.tokens)} tokens · resets ${when(p.resetsAt)}${p.limit ? '' : ' · no limit'}` },
      el('span', {}, label), p.limit ? bar(p.usd, scale, p.limit, p.level) : el('span', { class: 'muted' }, '·'.repeat(BAR)),
      el('span', {}, el('span', { class: p.level ?? '' }, amount), p.limit ? ` / ${dollars(p.limit)}` : el('span', { class: 'muted' }, ' no limit'),
        el('span', { class: 'muted' }, ` · ${n(p.tokens)} tokens · resets ${when(p.resetsAt)}`))));
  }
  fill('windows', prompt('jerome limits', latest ? meta(`read ${when(latest.readAt)} (${latest.source})`) : null), el('div', { class: 'bars' }, rows));
}

function renderCards(d) {
  const line = (label, t) => el('div', {}, el('span', { class: 'label' }, label), `${n(t.tokens).padStart(6)} tokens  ${usd(t)}`);
  const open = d.requests.length;
  fill('cards', prompt('jerome state'), el('div', { class: 'totals' },
    line('today', d.usage.today), line('7 days', d.usage.week), line('30 days', d.usage.month),
    el('div', {}, el('span', { class: 'label' }, 'open'), el('span', { class: open ? 'warn' : 'ok' }, String(open)), ` decision ${open === 1 ? 'request' : 'requests'}`),
    d.assumptions.length ? el('div', {}, el('span', { class: 'label' }, 'assumed'), String(d.assumptions.length), ` ${d.assumptions.length === 1 ? 'assumption' : 'assumptions'} to confirm`) : null));
}

// Areas (D102): each with its milestone, pace, priority, last heartbeat, what holds it, and its usage over 7 days.
function renderAreas(d) {
  const box = document.getElementById('areas');
  box.hidden = !d.areas || d.areasImplicit;
  if (box.hidden) return;
  const top = Math.max(0, ...d.areas.map((a) => a.week.apiUsd), d.shared.apiUsd);
  const rows = [];
  for (const a of [...d.areas].sort((x, y) => x.priority - y.priority)) {
    const held = a.pace === 'paused' ? el('span', { class: 'warn' }, '⏸ paused')
      : a.request ? el('a', { href: a.request.runId ? `#run-${a.request.runId}` : '#requests', class: 'warn', title: a.request.question }, `waiting R${a.request.id}`) : el('span', { class: 'ok' }, 'active');
    rows.push(el('tr', {},
      el('td', {}, el('strong', {}, a.name)), el('td', { class: 'cyan' }, a.milestone ?? '—'), el('td', {}, a.pace), el('td', { class: 'num' }, String(a.priority)),
      el('td', {}, a.lastHeartbeat ? when(a.lastHeartbeat) : el('span', { class: 'muted' }, 'never')), el('td', {}, held),
      el('td', { class: 'num' }, n(a.week.tokens)), el('td', { class: 'num' }, usd(a.week)), el('td', {}, top ? bar(a.week.apiUsd, top, null, 'cyan') : '')));
    rows.push(el('tr', { class: 'sub' }, el('td', {}, ''), el('td', { colspan: 8, class: 'muted wrap' }, `criteria: ${a.criteria ?? 'none'} · folder ${a.folder}${a.agents.length ? ` · ${a.agents.join(', ')}` : ''}`)));
  }
  rows.push(el('tr', {}, el('td', { class: 'muted' }, 'shared'), el('td', { colspan: 5, class: 'muted' }, 'lead agent and agents of several areas, in sessions'),
    el('td', { class: 'num' }, n(d.shared.tokens)), el('td', { class: 'num' }, usd(d.shared)), el('td', {}, top ? bar(d.shared.apiUsd, top, null, 'cyan') : '')));
  fill('areas', prompt('cat .jerome/areas.md', meta('areas · usage over 7 days')),
    el('div', { class: 'scroll' }, el('table', {},
      el('thead', {}, el('tr', {}, ['Area', 'Milestone', 'Pace', 'Prio', 'Last heartbeat', 'Status', 'Tokens', 'API equivalent', 'Share'].map((h, i) => el('th', { class: i === 3 || i === 6 || i === 7 ? 'num' : null }, h)))),
      el('tbody', {}, rows))));
}

function renderRequests(d) {
  const items = d.requests.map((r) => el('div', { class: 'request' },
    el('div', {}, el('span', { class: 'warn' }, `R${r.id}`), r.area ? el('span', { class: 'cyan' }, `  ${r.area}`) : '', r.kind === 'milestone' ? el('span', { class: 'muted' }, ' · milestone, holds the area') : '', '  ', r.question),
    r.options ? el('div', {}, el('span', { class: 'muted' }, 'options         '), r.options) : null,
    r.recommendation ? el('div', {}, el('span', { class: 'muted' }, 'recommendation  '), r.recommendation) : null,
    el('div', { class: 'muted' }, `opened ${when(r.openedAt)}`, r.runId ? [' · ', el('a', { href: `#run-${r.runId}` }, `→ run ${r.runId}`)] : null)));
  // Assumptions (D116): minor choices made without asking, to confirm or correct in one block; they hold nothing up.
  const assumed = d.assumptions.length ? el('div', { class: 'request' },
    el('div', { class: 'muted' }, 'assumptions in open.md, to confirm or correct in one block'),
    d.assumptions.map((a) => el('div', {}, el('span', { class: 'cyan' }, a.id), '  ', a.text))) : null;
  fill('requests', prompt('jerome state --json | jq .requests', meta('decision requests')), items.length ? items : el('div', { class: 'muted' }, 'None open.'), assumed);
}

function renderTeam(d) {
  const week = new Map(d.agents.map((a) => [a.agent, a]));
  const replies = new Map((d.replies ?? []).map((r) => [r.agent, r]));
  const usageOf = (name) => { const a = week.get(name); return a ? `${n(a.tokens)} · ${usd(a)}` : el('span', { class: 'muted' }, 'no usage in 7 days'); };
  const lead = el('div', { class: 'row' }, el('strong', {}, 'main'), el('span', { class: 'muted' }, 'lead agent'),
    el('span', { class: 'cyan' }, d.team.lead.models.join(', ') || 'session model'), el('span', {}, '·'), usageOf('main'));
  const subs = d.team.subagents.flatMap((a, i) => {
    const last = i === d.team.subagents.length - 1;
    const r = replies.get(a.agent);
    const cont = last ? '   ' : '│  ';
    return [
      el('div', { class: 'row' }, el('span', { class: 'branch' }, last ? '└─' : '├─'), el('strong', {}, a.agent),
        el('span', { class: a.source === 'built-in' ? 'muted' : 'cyan' }, a.source === 'built-in' ? 'built-in' : (a.model ?? 'no model')), el('span', {}, '·'), usageOf(a.agent)),
      a.tools.length ? el('div', { class: 'row' }, el('span', { class: 'cont' }, cont), el('span', { class: 'muted' }, a.tools.join(' · '))) : null,
      el('div', { class: 'row' }, el('span', { class: 'cont' }, cont),
        r ? el('span', {}, `replies avg ${words(r.average)} · max ${r.max} · `, el('span', { class: r.over ? 'warn' : 'ok' }, `${r.over}/${r.replies}`), ` over ${REPLY_LIMIT}`)
          : el('span', { class: 'muted' }, 'replies: no data yet')),
    ];
  });
  fill('team', prompt('ls .claude/agents', meta('team · usage over 7 days')), el('div', { class: 'tree' }, lead, subs));
}

const MARKS = { done: '✓', running: '●' };
function renderRuns(d) {
  const kinds = ['all', ...new Set(d.runs.map((r) => r.kind))];
  const filter = el('select', { onchange: (e) => { state.kind = e.target.value; renderRuns(state.data); } },
    kinds.map((k) => el('option', { value: k, selected: k === state.kind }, k)));
  // With areas (D102), each run shows its own, and the list can be narrowed to one.
  const withAreas = d.areas && !d.areasImplicit;
  const areaNames = ['all', ...(withAreas ? d.areas.map((a) => a.name) : []), 'none'];
  const areaFilter = withAreas ? el('select', { onchange: (e) => { state.area = e.target.value; renderRuns(state.data); } },
    areaNames.map((k) => el('option', { value: k, selected: k === state.area }, k))) : null;
  const columns = withAreas ? 8 : 7;
  const rows = [];
  for (const r of d.runs.filter((x) => (state.kind === 'all' || x.kind === state.kind) && (!withAreas || state.area === 'all' || (x.area ?? 'none') === state.area))) {
    const open = state.open.has(r.id);
    rows.push(el('tr', { class: `run${open ? ' open' : ''}`, id: `run-${r.id}`, tabindex: 0, onclick: () => toggleRun(r),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRun(r); } } },
      el('td', {}, el('span', { class: 'muted' }, open ? '▾ ' : '▸ '), when(r.startedAt)),
      el('td', {}, r.kind),
      withAreas ? el('td', { class: r.area ? 'cyan' : 'muted' }, r.area ?? '—') : null,
      el('td', { title: r.triage ? `triage: ${r.triage.reason ?? ''}` : null }, el('span', { class: r.status }, `${MARKS[r.status] ?? '✗'} ${r.status}`), r.reason && r.status !== 'done' ? el('span', { class: 'muted' }, ` ${r.reason}`) : ''),
      el('td', { class: 'num' }, duration(r.durationMs)),
      el('td', { class: 'num' }, n(r.tokens)),
      el('td', { class: 'num' }, usd(r)),
      el('td', { class: 'muted' }, r.agents.join(', '))));
    if (open) rows.push(el('tr', { class: 'detail' }, el('td', { colspan: columns }, runDetail(r))));
  }
  const heads = ['Start', 'Kind', ...(withAreas ? ['Area'] : []), 'Status', 'Duration', 'Tokens', 'API equivalent', 'Agents'];
  const numeric = new Set(['Duration', 'Tokens', 'API equivalent']);
  fill('runs', prompt(`jerome state --runs ${d.runs.length || 50}`, meta(el('label', {}, 'kind '), filter, areaFilter ? [' ', el('label', {}, 'area '), areaFilter] : null)),
    el('div', { class: 'scroll' }, el('table', {},
      el('thead', {}, el('tr', {}, heads.map((h) => el('th', { class: numeric.has(h) ? 'num' : null }, h)))),
      el('tbody', {}, rows.length ? rows : el('tr', {}, el('td', { colspan: columns, class: 'muted' }, 'No runs yet.'))))));
}

async function toggleRun(r) {
  // A running run opens its live view (D115).
  if (r.status === 'running' && !state.open.has(r.id)) {
    location.hash = `live-${r.id}`;
    return;
  }
  if (state.open.has(r.id)) state.open.delete(r.id);
  else {
    state.open.add(r.id);
    if (!state.details.has(r.id)) await loadRun(r.id);
  }
  renderRuns(state.data);
  document.getElementById(`run-${r.id}`)?.focus({ preventScroll: true });
}

async function loadRun(id) {
  try {
    const res = await fetch(api(`/api/runs/${id}`), { cache: 'no-store' });
    state.details.set(id, await res.json());
  } catch (err) {
    state.details.set(id, { error: String(err) });
  }
}

function runDetail(r) {
  const x = state.details.get(r.id);
  if (!x) return el('div', { class: 'muted' }, 'loading…');
  if (x.error) return el('div', { class: 'error' }, `error: ${x.error}`);
  const parts = [];
  // The triage's verdict (D110): why this run worked on that area, or found nothing to do.
  if (r.triage) {
    const t = r.triage;
    parts.push(el('div', {}, el('span', { class: 'muted' }, 'triage '), t.work ? `${t.area ? `${t.area} · ` : ''}${t.task ?? ''}${t.milestone ? ' · milestone check' : ''}` : 'no work',
      t.reason ? el('span', { class: 'muted' }, ` — ${t.reason}`) : ''));
  }
  parts.push(el('div', {}, el('span', { class: 'muted' }, 'usage  '), x.usage.length ? x.usage.map((u) => `${u.agent} (${u.model}) ${u.calls} calls ${n(u.tokens)}`).join(' · ') : 'none recorded'));
  for (const e of x.events) {
    parts.push(el('div', { class: e.kind === 'error' ? 'error' : 'warn' }, `${when(e.at)} ${e.kind === 'blocked' ? `refused chain (D49): ${(e.data?.subcommands ?? []).join(' + ')}` : `hook error: ${e.data?.message ?? ''}`}${e.agent && e.agent !== 'main' ? ` · ${e.agent}` : ''}`));
  }
  if (x.transcript === 'unavailable') parts.push(el('div', { class: 'muted' }, r.kind === 'service' ? 'Service run: no transcript.' : 'Transcript not available: only usage is shown.'));
  else if (!x.delegations.length) parts.push(el('div', { class: 'muted' }, 'No delegations in this run.'));
  if (x.calls?.length) {
    const contexts = x.calls.map((c) => c.context);
    const total = contexts.reduce((a, b) => a + b, 0) + x.calls.reduce((a, c) => a + c.output, 0);
    const widest = Math.max(...contexts);
    parts.push(el('details', {}, el('summary', {}, `lead agent calls · ${x.calls.length} · context ${n(Math.min(...contexts))} to ${n(widest)} · ${n(total)} tokens in all`),
      el('div', { class: 'scroll' }, el('table', {},
        el('thead', {}, el('tr', {}, ['#', 'Time', 'Context', '', 'Output', 'Tools'].map((h, i) => el('th', { class: i >= 2 && i <= 4 && i !== 3 ? 'num' : null }, h)))),
        el('tbody', {}, x.calls.map((c, i) => el('tr', {},
          el('td', { class: 'muted' }, String(i + 1)), el('td', {}, when(c.at)), el('td', { class: 'num' }, n(c.context)), el('td', {}, bar(c.context, widest, null, 'cyan')), el('td', { class: 'num' }, n(c.output)),
          el('td', {}, c.tools.length ? c.tools.map((t) => `${t.name}${t.hint ? ` ${t.hint}` : ''}`).join(' · ') : (c.text ? 'reply' : '—')))))))));
  }
  for (const g of x.delegations) {
    const over = g.replyWords > REPLY_LIMIT;
    parts.push(el('div', { class: 'delegation' },
      el('div', {}, el('strong', {}, g.agentType ?? 'subagent'), g.description ? ` · ${g.description}` : '', g.background ? el('span', { class: 'muted' }, ' · in the background') : '', el('span', { class: 'muted' }, ` · ${when(g.at)}`)),
      el('details', {}, el('summary', {}, 'task'), el('pre', {}, g.task || '(empty)')),
      el('details', {}, el('summary', {}, 'reply · ', el('span', { class: over ? 'warn' : '' }, `${words(g.replyWords)}${over ? ` (over ${REPLY_LIMIT})` : ''}`)), el('pre', {}, g.reply || '(no reply recorded)'))));
  }
  parts.push(el('div', { class: 'muted' }, '# Tasks and replies are read now from Claude Code\'s transcripts and are not stored by Jérôme.'));
  return parts;
}

function renderUsage(d) {
  const labels = { today: 'today', week: '7d', month: '30d' };
  const tabs = Object.entries(labels).map(([k, v]) => el('button', { class: k === state.period ? 'on' : '', 'aria-pressed': String(k === state.period), onclick: () => { state.period = k; renderUsage(state.data); } }, v));
  const list = d.byModel[state.period] ?? [];
  const top = Math.max(0, ...list.map((u) => u.apiUsd ?? 0));
  const rows = list.map((u) => el('tr', {},
    el('td', {}, u.agent), el('td', { class: 'cyan' }, u.model), el('td', { class: 'num' }, String(u.calls)), el('td', { class: 'num' }, n(u.input)),
    el('td', { class: 'num' }, n(u.output)), el('td', { class: 'num' }, n(u.cacheRead)), el('td', { class: 'num' }, n(u.cacheWrite)), el('td', { class: 'num' }, usd(u)),
    el('td', {}, top ? bar(u.apiUsd ?? 0, top, null, 'cyan') : '')));
  fill('usage', prompt('jerome state --json | jq .byModel', meta('usage by agent and model ', tabs)),
    el('div', { class: 'scroll' }, el('table', {},
      el('thead', {}, el('tr', {}, ['Agent', 'Model', 'Calls', 'Input', 'Output', 'Cache read', 'Cache write', 'API equivalent', 'Share'].map((h, i) => el('th', { class: i >= 2 && i <= 7 ? 'num' : null }, h)))),
      el('tbody', {}, rows.length ? rows : el('tr', {}, el('td', { colspan: 9, class: 'muted' }, 'No usage in this period.'))))));
}

function renderReplies(d) {
  const recorded = new Map((d.replies ?? []).map((r) => [r.agent, r]));
  const list = [...recorded.values()];
  const scale = Math.max(REPLY_LIMIT * 1.5, ...list.map((r) => r.max));
  const rows = list.map((r) => el('div', { class: 'row', title: `average ${r.average}, longest ${r.max}, limit ${REPLY_LIMIT} words` },
    el('span', {}, r.agent),
    bar(r.average, scale, REPLY_LIMIT, r.average > REPLY_LIMIT ? 'over' : 'ok'),
    el('span', {}, `avg ${words(r.average)} · max ${r.max} · `, el('span', { class: r.over ? 'warn' : 'ok' }, `${r.over}/${r.replies}`), ' over')));
  // Agents of the team with no reply recorded yet are listed too, so a missing figure is never mistaken for zero.
  for (const a of d.team.subagents) {
    if (!recorded.has(a.agent)) rows.push(el('div', { class: 'row' }, el('span', {}, a.agent), el('span', { class: 'muted' }, '·'.repeat(BAR)), el('span', { class: 'muted' }, 'no data yet')));
  }
  fill('replies', prompt('jerome state --replies', meta(`reply lengths · 7 days · limit ${REPLY_LIMIT} words`)),
    rows.length ? el('div', { class: 'bars' }, rows) : el('div', { class: 'muted' }, 'No subagents yet.'));
}

function render(d) {
  renderHeader(d); renderCards(d); renderAreas(d); renderRequests(d); renderTeam(d); renderRuns(d); renderUsage(d); renderReplies(d);
  fill('footer', `# Dollar amounts are API equivalents at the list prices of ${d.pricesDate}: a subscription is not billed per token. Read-only: the viewer never writes anything.`);
}

let last = '';
async function refresh() {
  try {
    const res = await fetch(api('/api/state'), { cache: 'no-cache' });
    const text = await res.text();
    const data = JSON.parse(text);
    if (!res.ok) throw new Error(data.error || res.statusText);
    document.getElementById('error').hidden = true;
    // A running run's detail is refreshed with the state; finished runs keep theirs.
    for (const id of state.open) if (data.runs.find((r) => r.id === id)?.status === 'running') await loadRun(id);
    if (text !== last || [...state.open].some((id) => data.runs.find((r) => r.id === id)?.status === 'running')) {
      last = text;
      state.data = data;
      render(data);
    }
  } catch (err) {
    const box = document.getElementById('error');
    box.textContent = `error: cannot read the project state: ${err.message}`;
    box.hidden = false;
  }
}

// The live view of a running run (D115): the lead agent, its subagents linked to it by lines, a log and a status
// bar, asked every 2 seconds while the run is running and the tab visible. Lines move only with real data: the line
// to an agent flows while it works on a task, a pulse runs back when its result arrives, a finished agent's line is
// still. With reduced motion, only colours change.
const live = { id: null, timer: null, statuses: new Map(), data: null, paths: new Map(), svg: null, follow: true };
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SVG = 'http://www.w3.org/2000/svg';
const clock = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const agentKey = (a) => a.toolUseId || a.agentId;

function showLive(id) {
  if (live.id !== id) {
    live.id = id; live.statuses = new Map(); live.data = null; live.paths = new Map(); live.svg = null; live.follow = true;
    fill('live', el('div', { class: 'muted' }, 'loading the live view…'));
  }
  document.getElementById('overview').hidden = true;
  document.getElementById('live').hidden = false;
  pollLive();
}

function hideLive() {
  clearTimeout(live.timer);
  live.id = null;
  document.getElementById('live').hidden = true;
  document.getElementById('overview').hidden = false;
}

async function pollLive() {
  clearTimeout(live.timer);
  const id = live.id;
  if (!id) return;
  try {
    const res = await fetch(api(`/api/runs/${id}/live`), { cache: 'no-store' });
    const data = await res.json();
    if (live.id !== id) return;
    if (data.error) throw new Error(data.error);
    renderLive(data);
    // Asked again only while the run is running and the tab visible; a hidden tab asks again when shown.
    if (data.run.status === 'running' && !document.hidden) live.timer = setTimeout(pollLive, 2000);
  } catch (err) {
    fill('live', el('div', { class: 'error' }, `error: cannot read the run: ${err.message}`), el('a', { href: '#' }, '← runs'));
  }
}

function renderLive(d) {
  const ended = live.data !== null && live.data.run.status === 'running' && d.run.status !== 'running';
  live.data = d;
  const running = d.run.status === 'running';
  const box = (cls, title, ...lines) => el('div', { class: `box ${cls}` }, el('div', { class: 'title' }, title), ...lines);
  const lead = d.lead;
  const leadBox = box(`lead ${running ? 'busy' : 'idle'}`, [el('strong', {}, 'main'), el('span', { class: 'muted' }, ' · lead agent')],
    el('div', {}, lead.model ?? 'no call yet', ' · ', el('span', { class: d.run.status }, d.run.status)),
    lead.lastCall ? el('div', {}, `last call ${clock(lead.lastCall.at)} · context ${n(lead.lastCall.context)} · output ${n(lead.lastCall.output)}`) : el('div', { class: 'muted' }, 'no call yet'),
    lead.waitingFor.length ? el('div', { class: 'cyan' }, `waiting for ${lead.waitingFor.join(', ')}`) : null);
  const agentBoxes = d.agents.map((a) => box(`agent ${a.status === 'running' || a.status === 'starting' ? 'busy' : 'idle'}`, [el('strong', {}, a.label), a.background ? el('span', { class: 'muted' }, ' · background') : null],
    el('div', {}, a.model ?? '—', ' · ', el('span', { class: a.status === 'done' ? 'done' : a.status === 'ended' ? 'muted' : 'running' }, a.status)),
    a.description ? el('div', { class: 'wrap' }, a.description) : null,
    el('div', { class: 'muted' }, `${n(a.tokens)} tokens · ${a.endedAt ? `ended ${clock(a.endedAt)}` : a.lastAt ? `last ${clock(a.lastAt)}` : 'starting'}`)));
  agentBoxes.forEach((b, i) => { b.dataset.key = agentKey(d.agents[i]); });

  let graph = document.getElementById('live-graph');
  if (!graph) {
    live.svg = document.createElementNS(SVG, 'svg');
    live.svg.setAttribute('class', 'links');
    live.svg.setAttribute('aria-hidden', 'true');
    graph = el('div', { id: 'live-graph', class: 'live-graph' }, live.svg, el('div', { class: 'lead-row', id: 'live-lead' }), el('div', { class: 'agents', id: 'live-agents' }));
    const logBox = el('div', { class: 'log', id: 'live-log' });
    logBox.addEventListener('scroll', () => { live.follow = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 4; });
    fill('live',
      el('div', { class: 'live-head' }, el('a', { href: '#' }, '← runs'), el('span', { id: 'live-title' }), el('span', { id: 'live-status' })),
      graph,
      el('section', {}, el('h2', {}, el('span', { class: 'muted' }, '#'), el('span', { class: 'cmd', id: 'live-log-title' })), logBox),
      el('div', { class: 'statusbar', id: 'live-bar' }));
    new ResizeObserver(() => drawLinks()).observe(graph);
  }
  fill('live-title', ` live · run ${d.run.id} · ${d.run.kind}${d.run.area ? ` · ${d.run.area}` : ''}`);
  fill('live-status', el('span', { class: d.run.status }, `● ${d.run.status}`), ` ${duration(d.elapsedMs)}`);
  fill('live-lead', leadBox);
  fill('live-agents', agentBoxes.length ? agentBoxes : el('div', { class: 'muted' }, 'no delegation yet'));

  fill('live-log-title', `log · run ${d.run.id}${d.logTotal > d.log.length ? ` · latest ${d.log.length} of ${d.logTotal}` : ''}`);
  const logBox = document.getElementById('live-log');
  logBox.replaceChildren(...(d.log.length ? d.log.map((l) => el('div', { class: 'line' },
    el('span', { class: 'muted' }, clock(l.at)), el('span', { class: l.agent === 'main' ? 'agent main' : 'agent cyan' }, l.agent),
    el('span', { class: l.action === 'blocked' || l.action === 'error' ? 'action error' : l.action === 'result' || l.action === 'handback' ? 'action done' : 'action' }, l.action),
    el('span', { class: 'detail' }, l.detail))) : [el('div', { class: 'muted' }, d.transcript === 'available' ? 'nothing yet' : 'the transcript is not there yet')]));
  if (live.follow) logBox.scrollTop = logBox.scrollHeight;

  const cap = d.cap;
  fill('live-bar',
    d.run.area ? `area ${d.run.area} · ` : '',
    `agents running ${d.active} · ${duration(d.elapsedMs)} · `,
    cap ? [`${n(d.tokens.total)} / ${n(cap.tokens)} tokens `, bar(d.tokens.total, Math.max(cap.tokens, d.tokens.total), cap.tokens, level(d.tokens.total, cap.tokens)),
      el('span', { class: level(d.tokens.total, cap.tokens) }, ` ${Math.round(cap.share * 100)}%`), ` · turns cap ${cap.turns}${cap.once ? ' (this run)' : ''}`]
      : `${n(d.tokens.total)} tokens · ${d.run.kind === 'heartbeat' ? 'cap not recorded' : 'no cap (interactive session)'}`);

  drawLinks();
  // A result that arrived since the last reading: a pulse back to the lead agent.
  for (const a of d.agents) {
    const before = live.statuses.get(agentKey(a));
    if ((before === 'running' || before === 'starting') && a.status === 'done') pulse(agentKey(a));
    live.statuses.set(agentKey(a), a.status);
  }
  if (ended) document.getElementById('live-status').append(el('span', { class: 'muted' }, ' · ended, no longer asked'));
}

// One line per subagent, from the lead's box: to the top of a box in the first row, along the left gutter to the
// others. Paths are kept between readings, so a flowing line does not restart.
function drawLinks() {
  const graph = document.getElementById('live-graph');
  if (!graph || !live.data) return;
  const origin = graph.getBoundingClientRect();
  const leadBox = graph.querySelector('.box.lead');
  if (!leadBox) return;
  live.svg.setAttribute('width', origin.width);
  live.svg.setAttribute('height', origin.height);
  const l = leadBox.getBoundingClientRect();
  const x0 = l.left + l.width / 2 - origin.left;
  const y0 = l.bottom - origin.top;
  const boxes = [...graph.querySelectorAll('.box.agent')];
  const firstTop = Math.min(...boxes.map((b) => b.getBoundingClientRect().top));
  const keep = new Set();
  for (const b of boxes) {
    const key = b.dataset.key;
    const a = live.data.agents.find((x) => agentKey(x) === key);
    if (!a) continue;
    keep.add(key);
    const r = b.getBoundingClientRect();
    const top = r.top - origin.top;
    const mid = y0 + (firstTop - origin.top - y0) / 2;
    const d = r.top - firstTop < 2
      ? `M ${x0} ${y0} V ${mid} H ${r.left + r.width / 2 - origin.left} V ${top}`
      : `M ${x0} ${y0} V ${mid} H 4 V ${top + 12} H ${r.left - origin.left}`;
    let path = live.paths.get(key);
    if (!path) {
      path = document.createElementNS(SVG, 'path');
      live.svg.append(path);
      live.paths.set(key, path);
    }
    path.setAttribute('d', d);
    const cls = a.status === 'running' || a.status === 'starting' ? 'link flow' : a.status === 'done' ? 'link done' : 'link still';
    if (path.getAttribute('class') !== cls) path.setAttribute('class', cls);
  }
  for (const [key, path] of live.paths) if (!keep.has(key)) { path.remove(); live.paths.delete(key); }
}

// A short pulse from the agent back to the lead agent, along its line; none with reduced motion.
function pulse(key) {
  const path = live.paths.get(key);
  if (!path || reducedMotion()) return;
  const dot = document.createElementNS(SVG, 'circle');
  dot.setAttribute('r', '3.5');
  dot.setAttribute('class', 'pulse');
  const motion = document.createElementNS(SVG, 'animateMotion');
  motion.setAttribute('dur', '0.9s');
  motion.setAttribute('fill', 'freeze');
  motion.setAttribute('keyPoints', '1;0');
  motion.setAttribute('keyTimes', '0;1');
  motion.setAttribute('calcMode', 'linear');
  motion.setAttribute('path', path.getAttribute('d'));
  dot.append(motion);
  live.svg.append(dot);
  motion.beginElement?.();
  setTimeout(() => dot.remove(), 1000);
}

function route() {
  const id = Number((location.hash.match(/^#live-(\d+)$/) || [])[1]);
  if (id) showLive(id);
  else {
    if (live.id) hideLive();
    openFromHash();
  }
}

// #run-<id> opens that run, e.g. from a decision request.
async function openFromHash() {
  const id = Number((location.hash.match(/^#run-(\d+)$/) || [])[1]);
  if (!id || !state.data || !state.data.runs.some((r) => r.id === id)) return;
  if (!state.open.has(id)) {
    state.open.add(id);
    await loadRun(id);
    renderRuns(state.data);
  }
  document.getElementById(`run-${id}`)?.scrollIntoView({ block: 'start' });
}
window.addEventListener('hashchange', route);

// Opened from `jerome projects --view`: a way back to the overview.
if (location.pathname.startsWith('/p/')) {
  document.getElementById('back-link').href = `/?t=${encodeURIComponent(token)}`;
  document.getElementById('back').hidden = false;
}

refresh().then(route);
setInterval(() => { if (!document.hidden) refresh(); }, 10_000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  refresh();
  if (live.id && live.data?.run.status === 'running') pollLive();
});
</script>
</body>
</html>
