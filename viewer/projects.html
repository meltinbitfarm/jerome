<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Jérôme projects</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="brand">
      <img id="icon" alt="" width="40" height="40">
      <div>
        <h1><span class="muted">jerome projects ·</span> <span id="count">…</span></h1>
        <div class="muted" id="updated">loading…</div>
      </div>
    </div>
    <div>
      <label class="muted" for="theme">theme</label>
      <select id="theme"><option value="auto">auto</option><option value="light">light</option><option value="dark">dark</option></select>
    </div>
  </header>
  <div id="error" class="error" hidden></div>
  <div class="dash-top">
    <section id="link"></section>
    <section id="windows"></section>
  </div>
  <section id="attention"></section>
  <section id="projects"></section>
  <section id="orphans" hidden></section>
  <footer id="footer"></footer>
</main>
<script>
'use strict';
const token = new URLSearchParams(location.search).get('t') || '';
const api = (path) => `${path}?t=${encodeURIComponent(token)}`;
document.getElementById('icon').src = api('/icon.png');

// Elements are built with textContent only: a reason or a question can hold anything, and none of it is read as HTML.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const fill = (id, ...children) => document.getElementById(id).replaceChildren(...children.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false));
// A section's title, written as the command that prints the same data in a terminal.
const prompt = (command, ...meta) => el('h2', {}, el('span', { class: 'ps' }, '$'), el('span', { class: 'cmd' }, command), ...meta);
const meta = (...children) => el('span', { class: 'meta' }, ...children);

function n(v) {
  if (v >= 1e6) return `${(v / 1e6).toFixed(1).replace(/\.0$/, '')}M`;
  if (v >= 1e3) return `${Math.round(v / 1e3)}k`;
  return String(v ?? 0);
}
function usd(t) {
  const v = t.apiUsd ?? 0;
  const amount = v > 0 && v < 0.005 ? '<$0.01' : v === 0 ? '$0.00' : `≈$${v.toFixed(2)}`;
  return `${amount}${t.unpriced ? '+?' : ''} API`;
}
// "40 minutes ago", "5 hours ago", "3 days ago", as `jerome projects` writes it.
function ago(iso) {
  const ms = Math.max(0, Date.now() - Date.parse(iso));
  const plural = (v, unit) => `${v} ${unit}${v === 1 ? '' : 's'} ago`;
  if (ms < 3_600_000) return plural(Math.max(1, Math.floor(ms / 60_000)), 'minute');
  if (ms < 48 * 3_600_000) return plural(Math.floor(ms / 3_600_000), 'hour');
  return plural(Math.floor(ms / 86_400_000), 'day');
}

// Theme: the system's, or the one picked here, remembered in this browser only (the same as in each project's page).
const themeSelect = document.getElementById('theme');
function applyTheme(value) {
  if (value === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', value);
}
try { themeSelect.value = localStorage.getItem('jerome-theme') || 'auto'; } catch { themeSelect.value = 'auto'; }
applyTheme(themeSelect.value);
themeSelect.addEventListener('change', () => {
  applyTheme(themeSelect.value);
  try { localStorage.setItem('jerome-theme', themeSelect.value); } catch { /* not remembered */ }
});

const link = (p) => el('a', { href: `/p/${encodeURIComponent(p.key)}/?t=${encodeURIComponent(token)}` }, p.name);

function render(d) {
  const needing = d.projects.filter((p) => p.attention.length).length;
  fill('count', `${d.projects.length} ${d.projects.length === 1 ? 'project' : 'projects'}`, needing ? el('span', { class: 'warn' }, ` · ${needing} ${needing === 1 ? 'needs' : 'need'} you`) : '');
  fill('updated', `read at ${new Date(d.at).toLocaleTimeString()} · every project of this machine, read-only`);

  const windows = Object.entries(d.windows);
  fill('windows', prompt('jerome limits', meta('the account’s, for all projects')),
    windows.length
      ? el('div', {}, windows.map(([name, w], i) => [i ? ' · ' : '', `${name === 'five_hour' ? '5h' : '7d'} `,
        w.stale ? el('span', { class: 'muted' }, 'no reading since its reset') : el('span', { class: w.level || '' }, `${w.used}%${w.limit !== null ? ` / ${w.limit}%` : ''}`)]))
      : el('div', { class: 'muted' }, 'no reading of the subscription windows yet'),
    d.governor ? el('div', { class: { go: 'ok', hold: 'warn' }[d.governor.verdict] ?? 'muted' }, `governor: ${d.governor.why}`) : null);
  renderLink(d.director);

  const attention = d.projects.filter((p) => p.attention.length);
  const section = document.getElementById('attention');
  section.hidden = !attention.length;
  fill('attention', prompt('jerome projects', meta('what needs you')),
    attention.map((p) => el('div', { class: 'request' }, el('strong', {}, link(p)), el('span', { class: 'muted path' }, `  ${p.path}`),
      p.attention.map((r) => el('div', { class: 'warn' }, `! ${r}`)))));

  renderProjects(d);

  const orphans = document.getElementById('orphans');
  orphans.hidden = !d.orphans.length;
  fill('orphans', prompt('jerome doctor', meta('databases whose folder no longer holds a project')),
    d.orphans.map((o) => el('div', {}, `${o.text}, ${o.summary}`)),
    el('div', { class: 'muted' }, 'If the project moved, run `jerome doctor` in its new folder to relink it; if it is gone, `jerome forget <key>` removes the database after a backup.'));

  fill('footer', `# Dollar amounts are API equivalents at the list prices of ${d.pricesDate}: a subscription is not billed per token. Read-only: the viewer never writes anything.`);
}

// This Mac's link to Jérôme Director (D145, D149): what it means for the runs here, in one or two lines.
function renderLink(link) {
  const since = link?.lastOk ? ` since ${new Date(link.lastOk).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : '';
  const said = {
    none: ['muted', 'not connected to a Director: this Mac works on its own.', 'With several Macs on one Claude account, `jerome connect` links this one to Jérôme Director.'],
    pending: ['warn', 'connected, waiting for approval: on the server, `jerome director approve`.', null],
    revoked: ['high', 'revoked on the Director: `jerome disconnect`, then `jerome connect` if it should come back.', null],
    watched: ['ok', 'connected: the Director watches, and this Mac fills its spare quota on its own.', null],
    directed: ['ok', 'directed: the Director gives the fill runs and the slots their turn.', null],
    local: ['warn', `on its own${since}: the Director is silent, so this Mac goes on at a reduced pace.`, null],
  }[link?.state ?? 'none'];
  fill('link', prompt('jerome connect status', meta(link?.name ? `this mac: ${link.name}` : 'this mac')),
    el('div', { class: said[0] }, said[1]),
    said[2] ? el('div', { class: 'muted small' }, said[2]) : null,
    link?.telegram ? el('div', { class: 'muted small' }, 'Telegram: the bot is on the Director, for every Mac.') : null);
}

// The projects as a grid of cards, in the server's order (what needs you first, then the newest activity), with a
// filter kept across refreshes.
const view = { filter: 'all' };
const stateOf = (p) => (p.error ? 'error' : p.alerts.length ? 'stuck' : p.requests.length ? 'asking' : p.lastHeartbeat?.status === 'running' ? 'running' : p.attention.length ? 'stuck' : 'idle');
const STATE = { error: ['high', 'unreadable'], stuck: ['high', 'needs you'], asking: ['warn', 'waits for your answer'], running: ['running', 'working now'], idle: ['muted', 'waiting for its next turn'] };
const FILTER = { all: () => true, 'need you': (p) => p.attention.length > 0, working: (p) => stateOf(p) === 'running' };
let lastData = null;
function renderProjects(d) {
  lastData = d;
  if (!d.projects.length) return fill('projects', prompt('jerome projects'), el('div', { class: 'muted' }, 'No project on this machine yet: `jerome new <name>` creates one, `jerome init` brings Jérôme into an existing one.'));
  if (view.filter !== 'all' && !d.projects.some(FILTER[view.filter])) view.filter = 'all';
  const tabs = Object.keys(FILTER).filter((k) => k === 'all' || d.projects.some(FILTER[k])).map((k) => {
    const b = el('button', { type: 'button', class: view.filter === k ? 'on' : null }, `${k} ${d.projects.filter(FILTER[k]).length}`);
    b.addEventListener('click', () => { view.filter = k; renderProjects(lastData); });
    return b;
  });
  const shown = d.projects.filter(FILTER[view.filter]);
  fill('projects', prompt('jerome projects', meta('what needs you first, then the newest activity')),
    tabs.length > 1 ? el('div', { class: 'pfilters' }, tabs) : null,
    el('div', { class: 'pcards' }, shown.map(projectCard)));
}
function projectCard(p) {
  const state = stateOf(p);
  const h = p.lastHeartbeat;
  const facts = p.error ? [] : [
    el('span', { class: p.requests.length ? 'warn' : 'muted' }, `${p.requests.length} requests`),
    el('span', { class: 'muted' }, `${p.assumptions} assumed`),
    el('span', {}, `7d ${n(p.week.tokens)} tokens`),
    el('span', { class: 'muted' }, usd(p.week)),
  ];
  return el('article', { class: `pcard ${state === 'error' ? 'stuck' : state}` },
    el('div', { class: 'phead' }, el('strong', {}, link(p)), el('span', { class: STATE[state][0] }, STATE[state][1])),
    p.attention.map((r) => el('div', { class: 'warn small' }, `! ${r}`)),
    p.error ? null : el('div', { class: 'small' }, h
      ? [el('span', { class: 'muted' }, `last heartbeat ${ago(h.startedAt)} `), el('span', { class: h.status }, h.status)]
      : el('span', { class: 'muted' }, p.schedule ? 'no heartbeat yet' : 'not scheduled')),
    h?.reason ? el('div', { class: 'muted small clip', title: h.reason }, h.reason) : null,
    p.schedule ? el('div', { class: 'muted small' }, p.schedule.text) : null,
    !p.error && !p.areasImplicit ? el('div', { class: 'small' }, p.areas.map((a, i) => [i ? ', ' : '', a.name, el('span', { class: 'cyan' }, a.milestone ? ` ${a.milestone}` : ''), a.pace === 'paused' ? el('span', { class: 'muted' }, ' paused') : ''])) : null,
    facts.length ? el('div', { class: 'pfacts small' }, facts) : null,
    el('div', { class: 'muted small clip' }, p.path));
}

let last = '';
async function refresh() {
  try {
    const res = await fetch(api('/api/projects'), { cache: 'no-cache' });
    const text = await res.text();
    const data = JSON.parse(text);
    if (!res.ok) throw new Error(data.error || res.statusText);
    document.getElementById('error').hidden = true;
    if (text !== last) {
      last = text;
      render(data);
    }
  } catch (err) {
    const box = document.getElementById('error');
    box.textContent = `error: cannot read the projects: ${err.message}`;
    box.hidden = false;
  }
}

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 10_000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
