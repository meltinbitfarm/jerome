<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="With one Mac, a tap goes from the bridge to the Mac in a couple of seconds. With the Director, a pending order and the Mac's beat come in between, so it takes up to a minute.">
  <style>
    :root { --bg: #ffffff; --fg: #18202b; --muted: #5b6676; --line: #b9c2cf; --accent: #1f4fa3; --accent-soft: #e3ebf8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a212b; --fg: #e6ebf2; --muted: #9aa6b6; --line: #3b4757; --accent: #7da6f0; --accent-soft: #1d2b44; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .h { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
    .l { font-size: 11.5px; }
    .la { font-size: 11.5px; fill: var(--accent); font-weight: 500; }
    .n { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .nb { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
    .a { stroke: var(--fg); stroke-width: 1.4; fill: none; }
    .aa { stroke: var(--accent); stroke-width: 1.8; fill: none; }
    .mk { fill: var(--fg); }
    .mka { fill: var(--accent); }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="960" height="280" rx="10"/>

  <text class="m" x="20" y="30">ONE MAC · a couple of seconds</text>
  <rect class="n" x="20" y="44" width="140" height="56" rx="8"/>
  <text class="h" x="90" y="70" text-anchor="middle">You tap B</text>
  <text class="s" x="90" y="88" text-anchor="middle">under the question</text>
  <rect class="n" x="176" y="44" width="140" height="56" rx="8"/>
  <text class="h" x="246" y="70" text-anchor="middle">Bridge on the Mac</text>
  <text class="s" x="246" y="88" text-anchor="middle">hears it at once</text>
  <rect class="n" x="644" y="44" width="140" height="56" rx="8"/>
  <text class="h" x="714" y="70" text-anchor="middle">The Mac answers</text>
  <text class="m" x="714" y="88" text-anchor="middle">request answer</text>
  <rect class="n" x="800" y="44" width="140" height="56" rx="8"/>
  <text class="h" x="870" y="70" text-anchor="middle">It tells you</text>
  <text class="s" x="870" y="88" text-anchor="middle">“R4 answered: B”</text>
  <line class="a" x1="160" y1="72" x2="172" y2="72" marker-end="url(#m)"/>
  <line class="a" x1="316" y1="72" x2="640" y2="72" marker-end="url(#m)"/>
  <text class="l" x="478" y="64" text-anchor="middle">on the same machine</text>
  <line class="a" x1="784" y1="72" x2="796" y2="72" marker-end="url(#m)"/>

  <text class="m" x="20" y="160">WITH THE DIRECTOR · within a minute</text>
  <rect class="n" x="20" y="174" width="140" height="56" rx="8"/>
  <text class="h" x="90" y="200" text-anchor="middle">You tap B</text>
  <text class="s" x="90" y="218" text-anchor="middle">under the question</text>
  <rect class="n" x="176" y="174" width="140" height="56" rx="8"/>
  <text class="h" x="246" y="200" text-anchor="middle">Bot on the Director</text>
  <text class="s" x="246" y="218" text-anchor="middle">“sent to mini”</text>
  <rect class="nb" x="332" y="174" width="140" height="56" rx="8"/>
  <text class="h" x="402" y="200" text-anchor="middle">Pending order</text>
  <text class="s" x="402" y="218" text-anchor="middle">in its database</text>
  <rect class="nb" x="488" y="174" width="140" height="56" rx="8"/>
  <text class="h" x="558" y="200" text-anchor="middle">The Mac's beat</text>
  <text class="s" x="558" y="218" text-anchor="middle">within 60 seconds</text>
  <rect class="n" x="644" y="174" width="140" height="56" rx="8"/>
  <text class="h" x="714" y="200" text-anchor="middle">The Mac answers</text>
  <text class="s" x="714" y="218" text-anchor="middle">after its own checks</text>
  <rect class="n" x="800" y="174" width="140" height="56" rx="8"/>
  <text class="h" x="870" y="200" text-anchor="middle">It tells you</text>
  <text class="s" x="870" y="218" text-anchor="middle">with the result</text>
  <line class="a" x1="160" y1="202" x2="172" y2="202" marker-end="url(#m)"/>
  <line class="a" x1="316" y1="202" x2="328" y2="202" marker-end="url(#m)"/>
  <line class="aa" x1="472" y1="202" x2="484" y2="202" marker-end="url(#ma)"/>
  <line class="aa" x1="628" y1="202" x2="640" y2="202" marker-end="url(#ma)"/>
  <line class="a" x1="784" y1="202" x2="796" y2="202" marker-end="url(#m)"/>
  <text class="la" x="480" y="258" text-anchor="middle">the two extra steps: the Director waits for the Mac to call in</text>
</svg>
