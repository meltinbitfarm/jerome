# Jérôme Director (D153), built from this repository. In Coolify: the repository as source, the Docker Compose
# build pack, base directory /director and compose file /compose.yaml (Coolify resolves the paths below from the
# base directory), the variable DIRECTOR_ADDRESS set to the server's address on your
# VPN (Tailscale, WireGuard or any other), and no domain. By hand: clone the repository, write director/.env with
#
#   DIRECTOR_ADDRESS=100.101.102.103
#
# and `docker compose up -d` in director/. Then `jerome director init`, run in the container, prints the address and
# the fingerprint to compare on each Mac. The port is published on that address only, never on all interfaces: Docker's
# published ports go around ufw, and the Director refuses to start when the address is missing or public (D145).
services:
  director:
    build:
      context: ..
      dockerfile: director/Dockerfile
    image: jerome-director
    restart: unless-stopped
    environment:
      DIRECTOR_ADDRESS: ${DIRECTOR_ADDRESS:?DIRECTOR_ADDRESS is required}
    ports:
      - "${DIRECTOR_ADDRESS:?DIRECTOR_ADDRESS is required}:7788:7788"
    volumes:
      - director-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  director-data:
