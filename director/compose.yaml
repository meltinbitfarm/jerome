# Jérôme Director (D153), built from this repository. Its paths start from the repository's root, which Coolify
# always uses as the project directory. In Coolify: the repository as source, the Docker Compose build pack, base
# directory /, compose file /director/compose.yaml, the variable DIRECTOR_ADDRESS set to the server's address on your
# VPN (Tailscale, WireGuard or any other), and no domain. By hand, from the repository's root, with DIRECTOR_ADDRESS in
# a .env file there:
#
#   docker compose --project-directory . -f director/compose.yaml up -d
#
# Then `jerome director init`, run in the container, prints the address and the fingerprint to compare on each Mac.
# The port is published on that address only, never on all interfaces: Docker's published ports go around ufw, and
# the Director refuses to start when the address is missing or public (D145).
services:
  director:
    build:
      context: .
      dockerfile: director/Dockerfile
    image: jerome-director
    restart: unless-stopped
    environment:
      DIRECTOR_ADDRESS: ${DIRECTOR_ADDRESS:?DIRECTOR_ADDRESS is required}
    ports:
      - "${DIRECTOR_ADDRESS:?DIRECTOR_ADDRESS is required}:7788:7788"
    volumes:
      - director-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  director-data:
